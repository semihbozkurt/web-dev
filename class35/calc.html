<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>

        </style>
    </head>
    <body>
        <div id="container">
            <div id="calculator">
                <div id="outputs">
                    <div id="history"></div>
                    <input style="display: flex; align-content: right;" type="text" id="output">
                </div>
                <div id="buttons">
                    <button onclick="operate()" class="operators" id="C">C</button>
                    <button onclick="operate()" class="operators" id="CE">CE</button>
                    <button onclick="operate()" class="operators" id="%">%</button>
                    <button onclick="operate()" class="operators" id="/">/</button>

                    <button onclick="write()" class="numbers" id="7">7</button>
                    <button onclick="write()" class="numbers" id="8">8</button>
                    <button onclick="write()" class="numbers" id="9">9</button>
                    <button onclick="operate()" class="operators" id="*">*</button>

                    <button onclick="write()" class="numbers" id="4">4</button>
                    <button onclick="write()" class="numbers" id="5">5</button>
                    <button onclick="write()" class="numbers" id="6">6</button>
                    <button onclick="operate()" class="operators" id="+">+</button>

                    <button onclick="write()" class="numbers" id="1">1</button>
                    <button onclick="write()" class="numbers" id="2">2</button>
                    <button onclick="write()" class="numbers" id="3">3</button>
                    <button onclick="operate()" class="operators" id="-">-</button>

                    <button onclick="write()" class="numbers" id="00">00</button>
                    <button onclick="write()" class="numbers" id="0">0</button>
                    <button onclick="operate()" class="operators" id=".">.</button>
                    <button onclick="operate()" class="operators" id="=">=</button>

                </div>
                <div></div>
            </div>
        </div>
    </body>

    <script>
        var history = document.getElementById('history')
        var output = document.getElementById('output')
        function write(){
            output.value+= this.value
        }
        function operate(){
            var outputVal= output.value
            history.innerText= outputVal+'+'
            outputVal = ''
        }
        function calc(){
            var tekst = history.innerText + output.value
            output.value=tekst.eval()
        }
        
    </script>
</html>
