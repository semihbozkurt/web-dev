<html>
    <head>
        <title>Dictionary</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            body{background-color: black; box-sizing: border-box; padding: 0; margin: 0; overflow-x: hidden;}

            .light{background-color: whitesmoke !important;}
            .dark{background-color: black !important;}
            .show{display: none !important;}

            #heady{
                width: 100vw;
                height: 12vh;
                position: fixed;
                top: 0px;
                left: 0px;
                display: flex;
                justify-content: space-between; align-items: center;
                background-color: blueviolet;
                padding: 18px;
                z-index: 100;
            }
            #heady a{
                color: white;
                
            }
            #searcher{
                width: 70vw;
                height: 30vh;
                border: 1px solid red;
                border-radius: 15px;
                display: flex;
                align-items: center; justify-content: center;
                background-color: whitesmoke;
            }
            #searcherCont{
                width: 100vw;
                height: 30vh;
                position: absolute;
                top: 0px;
                left: 0px;
                display: flex;
                justify-content: center; align-items: center;
                /*background-color: green;*/
                padding: 15px;
                margin-top: 22vh;
            }
            #searchWord{
                height: 40px; width: 270px;
                border-radius: 20px;
                padding: 5px;
            }
            
            #list{
                background-color: inherit;
                width: 90vw; height: 1000px;
                display: flex;
                flex-direction: column;
                margin-top: 12vh;
                border: 1px solid blue;
                box-shadow: 0 0 70px 10px;
                border-radius: 15px;
                background-color: whitesmoke;
                margin-bottom: 40px;
            }
        </style>
    </head>
    <body>
        
        <header id="heady">
            <div style="display: flex; gap: 25px; align-items: center;">
                <h3>Web<strong>site</strong></h3>
                <div style="display: flex; gap: 15px;">
                    <a href="dictionary.html">Dictionary</a>
                    <a href="dictionary.html">Currency EX</a>
                    <a href="dictionary.html">API</a>
                </div>
            </div>
            <button id="light-mode" onclick="light()" style="background-color: inherit; border-radius: 50%; border: none;">😁</button>
        </header>

        <div id="searcherCont">
        <div id="searcher">
            <div style="height: 20vh; display: flex; flex-direction: column; justify-content: space-between;">
                <div style="display: flex; gap: 10px;">
                    <p style="color: green;">Dictionary!</p>
                    <input type="text" id="searchWord" placeholder="Just search for!!!">
                </div>
                <div style="display: flex; justify-content: space-evenly;">
                    <button class="btn btn-danger" style="height: 30px; width: 60px;"></button>
                    <button class="btn btn-danger" style="height: 30px; width: 60px;"></button>
                    <button class="btn btn-danger" style="height: 30px; width: 60px;"></button>
                </div>
            </div>
        </div>
        </div>

        <div id="listCont" style="margin-top: 65vh;  display: flex; justify-content: center; align-items: center;">
            <div id="list"></div>
        </div>

        <!--light-mode-->
        <script>
            function light(){
                document.body.classList.toggle('light')
                document.getElementById('searcher').classList.toggle('dark')
            }
            document.getElementById('light-mode').addEventListener('contextmenu', (event)=>{
                event.preventDefault();
                let color= prompt('I dont know why you clicked that but now you get to chose the color'); 
                document.body.style.backgroundColor=color;
            })
        </script>

        <!--word searching-->
        <script>

        </script>
    </body>
</html>
