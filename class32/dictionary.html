<html>
    <head>
        <title>Dictionary</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="png" href="dictionİmage.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            body{background-color: black; box-sizing: border-box; padding: 0; margin: 0; overflow-x: hidden;}

            .light{background-color: whitesmoke !important;}
            .dark{background-color: black !important;}
            .show{display: none !important;}

            #heady{
                width: 100vw;
                height: 12vh;
                position: fixed;
                top: 0px;
                left: 0px;
                display: flex;
                justify-content: space-between; align-items: center;
                background-color: blueviolet;
                padding: 18px;
                z-index: 100;
            }
            #heady a{
                color: white;
                text-decoration:None;
                
            }
            #searcher{
                width: 70vw;
                height: 30vh;
                border: 1px solid red;
                border-radius: 15px;
                display: flex;
                align-items: center; justify-content: center;
                background-color: whitesmoke;
                overflow:hidden;

            }
            #searcherCont{
                width: 100vw;
                height: 30vh auto;
                position: absolute;
                top: 0px;
                left: 0px;
                display: flex;
                justify-content: center; 
                align-items: center;
                /*background-color: green;*/
                padding: 15px;
                margin-top: 22vh;
            }
            #searchWord{
                height: 40px; 
                width: 100%;
                border:5px solid #ebeae8;
                border-radius: 10px;
                padding: 20px;
            }
            
        </style>
    </head>
    <body>
        
        <header id="heady">
            <div style="display: flex; gap: 25px; align-items: center;">
                <h3>Web<strong>site</strong></h3>
                <div style="display: flex; gap: 15px;">
                    <a href="#">Dictionary</a>
                    <a href="#">Currency EX</a>
                    <a href="#">API</a>
                </div>
            </div>
            <button id="light-mode" onclick="light()" style="background-color: inherit; border-radius: 50%; border: none;">😁</button>
        </header>

        <div id="searcherCont">
        <div id="searcher">
            <div style="height: 20vh; display: flex; flex-direction: column; justify-content: space-between;">
                <div style="display: flex; gap: 10px;">
                    <div style="padding:5px;font-weight:bold;color: green;display:flex;align-items:center;">Dictionary!</div>
                    <input type="text" id="searchWord" placeholder="Just search for!!!">
                </div>
                <div style="display: flex; justify-content: space-evenly;">
                    <button onclick="searchWord()" class="btn btn-danger">Search</button>
                </div>
                <div><span id="result"></span></div>
            </div>
        </div>
        </div>


        <!--light-mode-->
        <script>
            function light(){
                document.body.classList.toggle('light')
                document.getElementById('searcher').classList.toggle('dark')
            }
            document.getElementById('light-mode').addEventListener('contextmenu', (event)=>{
                event.preventDefault();
                let color= prompt('I dont know why you clicked that but now you get to chose the color'); 
                document.body.style.backgroundColor=color;
            })

        </script>

        <script>
            async function searchWord(){
              var word = document.getElementById("searchWord").value.trim()
              var resultArea = document.getElementById("result")
              if (word == ""){
                resultArea.innerText = "Please Enter a word!"
                return
              }
                resultArea.innerText = "Searching......."
                //axios, fetch
               try{

                var response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`)
                if(!response.ok){
                  throw new Error("word was not found")
                }
                var data = await response.JSON.parse()
                document.write(response)

               }catch(error){
                console.log(error)
               }
               
               
              

            }
        </script>
    </body>
</html>
